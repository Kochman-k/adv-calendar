<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Good Deal by Synerise — Advent calendar</title>
<meta name="description" content="24 days, 24 prize draws. Open a new card every day from 1 to 24 December.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/day-01-captain-hat.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.hd{font-family:Jost,system-ui,sans-serif}
.num{font-family:Jost,system-ui,sans-serif;font-variant-numeric:lining-nums}
a{color:#fff;text-decoration:none}a:hover{color:#FFD27A}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #FFD27A;outline-offset:3px}
.fl{position:absolute;top:-24px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.8) 38%,rgba(255,255,255,0) 72%);pointer-events:none;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,0,0)}25%{transform:translate3d(14px,26vh,0)}50%{transform:translate3d(-12px,52vh,0)}75%{transform:translate3d(12px,78vh,0)}100%{transform:translate3d(0,max(106vh,1060px),0)}}
.cw{animation:sw 5s ease-in-out infinite;transform-origin:50% 0}
.cw:hover{animation-duration:1.8s !important}
@keyframes sw{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
.dz{animation:sw2 4s ease-in-out infinite;transform-origin:50% 0}
@keyframes sw2{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.bl{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}
.flip{transition:transform .9s cubic-bezier(.25,1.25,.4,1);transform-style:preserve-3d}
.face,.face0{position:absolute;inset:0;border-radius:26px;overflow:hidden;isolation:isolate}.off,.off *{pointer-events:none !important}.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.nav a{opacity:.92}.nav a:hover{opacity:1}
.ctl:hover:not(:disabled){background:rgba(255,255,255,.16) !important}.ctl:disabled{opacity:.3;cursor:default !important}
.kick{transform:rotate(calc(var(--tilt,0deg) * var(--amp,1)));transition:transform .35s ease-out;transform-origin:50% 0}.k2{--amp:1.8}.kc{--amp:.7}
.fwd{--d:1}.bwd{--d:-1}.ka .kick{animation:ka 1.9s ease-out}.kb .kick{animation:kb 1.9s ease-out}
@keyframes ka{16%{transform:rotate(calc(var(--d) * var(--amp,1) * -7deg))}38%{transform:rotate(calc(var(--d) * var(--amp,1) * 4deg))}58%{transform:rotate(calc(var(--d) * var(--amp,1) * -2deg))}78%{transform:rotate(calc(var(--d) * var(--amp,1) * .8deg))}}
@keyframes kb{16%{transform:rotate(calc(var(--d) * var(--amp,1) * -7deg))}38%{transform:rotate(calc(var(--d) * var(--amp,1) * 4deg))}58%{transform:rotate(calc(var(--d) * var(--amp,1) * -2deg))}78%{transform:rotate(calc(var(--d) * var(--amp,1) * .8deg))}}
.hbtn:hover{filter:brightness(1.12)}
.wish{position:absolute;left:32px;bottom:28px;max-width:330px}
.fld{width:100%;height:56px;box-sizing:border-box;border:1px solid #CFCBD6;border-radius:12px;background:#fff;font:inherit;font-size:18px;color:#15151B;padding:0 16px}
.fld:focus{outline:2px solid #15151B;outline-offset:1px;border-color:#15151B}.fld[aria-invalid="true"]{border-color:#C8102E}
.bnr{height:46px;box-sizing:border-box;white-space:nowrap}
@media (max-width:1280px){.wish{position:relative;left:auto;bottom:auto;margin:8px auto 36px;max-width:520px;text-align:center}}
@media (max-width:1100px){.gd{height:104px !important}}
@media (max-width:760px){.hdr{padding:16px 14px 0 !important;gap:8px !important}.blabel{display:none}.hbtn{width:44px;padding:0 !important}.gd{height:72px !important}.wish{margin:8px 20px 32px}.bnr{font-size:14px !important}.bdate{display:none}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}@keyframes fade{from{opacity:0}}
.sha{animation:sha .5s ease}.shb{animation:shb .5s ease}
@keyframes sha{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}@keyframes shb{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes popin{from{opacity:0;transform:scale(.2) rotate(-35deg)}}@keyframes nudge{0%{opacity:0;transform:translateY(8px)}12%,82%{opacity:1;transform:none}100%{opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,77,.7)}50%{box-shadow:0 0 0 8px rgba(255,201,77,0)}}
@media (max-width:760px){.ctlrow{grid-template-columns:auto auto !important;justify-content:center;gap:12px !important}.ctlpad,.hlabel{display:none}.ctlrow .ctl{padding:0 !important;width:54px}.mid{gap:12px !important}.cnt{width:150px !important}.cnt div{font-size:13px !important}}
@media (max-width:760px){.fl:nth-child(3n),.fl:nth-child(3n+1){display:none}}
@media (prefers-reduced-motion:reduce){.fl,.cw,.dz,.bl,.kick{animation:none !important}.flip{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div style="position: relative; overflow: hidden; min-height: 100vh; background: radial-gradient(120% 60% at 50% 100%, #0B1626 0%, #000 60%); color: #fff; font-family: Jost, system-ui, sans-serif; display: flex; flex-direction: column">

  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none">
    <sc-for list="{{ snowBack }}" as="f" hint-placeholder-count="20">
      <i class="fl" style="left: {{f.x}}%; width: {{f.s}}px; height: {{f.s}}px; opacity: {{f.o}}; animation-duration: {{f.d}}s; animation-delay: -{{f.dl}}s"></i>
    </sc-for>
  </div>

  <header class="hdr" style="position: relative; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 28px 56px 0">
    <button class="hbtn" type="button" onClick="{{ openHow }}" aria-label="How it works" style="justify-self: start; height: 44px; padding: 0 18px 0 14px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.06); color: #fff; font-size: 16px; font-weight: 500; cursor: pointer; transition: background .2s">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5.5"></path><path d="M12 7.6v.1"></path></svg>
      <span class="blabel">How it works</span>
    </button>
    <a href="#" aria-label="The Good Deal by Synerise — home" style="display: flex">
      <img class="gd" src="assets/the-good-deal-logo.webp" alt="The Good Deal by Synerise" style="height: 130px; width: auto; display: block">
    </a>
    <button class="hbtn" type="button" onClick="{{ share }}" aria-label="Share" style="justify-self: end; height: 44px; padding: 0 20px 0 16px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; border: 0; background: #FFC94D; color: #0B0B0C; font-size: 16px; font-weight: 600; cursor: pointer">
      <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5"></path><path d="M7.5 8L12 3.5 16.5 8"></path><path d="M5 12.5v5A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-5"></path></svg>
      <span class="blabel">Share</span>
    </button>
  </header>

  <div style="position: relative; z-index: 20; display: flex; justify-content: center; padding: 14px 16px 0">
    <sc-if value="{{ bannerNew }}" hint-placeholder-val="{{ true }}">
      <button class="bnr" type="button" onClick="{{ goToday }}" style="display: inline-flex; align-items: center; gap: 10px; padding: 8px 4px; border-radius: 999px; border: 0; background: transparent; color: #fff; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer; animation: fade .5s ease">
        <span aria-hidden="true" style="flex: none; width: 8px; height: 8px; border-radius: 50%; background: #FFC94D; animation: glow 2s ease-in-out infinite"></span>
        <span>A new card is ready to open<span class="bdate"> — {{todayLabel}}</span></span>
        <span style="flex: none; display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; background: #FFC94D; color: #0B0B0C; font-size: 13px; font-weight: 600">Open</span>
      </button>
    </sc-if>
    <sc-if value="{{ bannerDone }}" hint-placeholder-val="{{ false }}">
      <p class="bnr" role="status" style="margin: 0; display: inline-flex; align-items: center; gap: 10px; padding: 8px 4px; color: #fff; font-size: 15px; font-weight: 500; animation: fade .5s ease">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3DDC97" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Today's card is open. See you tomorrow!
      </p>
    </sc-if>
    <sc-if value="{{ bannerSoon }}" hint-placeholder-val="{{ false }}">
      <p class="bnr" style="margin: 0; display: inline-flex; align-items: center; padding: 8px 4px; color: #fff; font-size: 15px">The first card opens on 1 December.</p>
    </sc-if>
  </div>

  <section aria-label="Advent calendar" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onPointerCancel="{{ up }}" onClickCapture="{{ swallow }}" onWheel="{{ wheel }}" style="position: relative; z-index: 10; cursor: grab; height: 560px; margin-top: 10px; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none">
    <div aria-hidden="true" style="position: absolute; left: 50%; top: 40px; width: 640px; height: 540px; margin-left: -320px; background: radial-gradient(closest-side, rgba(255,200,120,.16), transparent); pointer-events: none"></div>

    <div ref="{{ trackRef }}" class="{{trackCls}}" style="position: absolute; left: 50%; top: 0; height: 100%; width: {{trackW}}px; transform: translateX(-{{offset}}px); transition: transform .65s cubic-bezier(.22,.8,.2,1)">
      <svg aria-hidden="true" width="{{trackW}}" height="120" style="position: absolute; left: 0; top: 0; overflow: visible">
        <path d="{{rope}}" fill="none" stroke="#45584A" stroke-width="2.6" stroke-linecap="round"></path>
        <path d="{{rope}}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1" stroke-dasharray="3 5"></path>
      </svg>

      <sc-for list="{{ decor }}" as="d" hint-placeholder-count="6">
        <div class="kick k2" aria-hidden="true" style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: 2px; height: {{d.len}}px; margin-left: -1px; animation-delay: {{d.kd}}s">
        <div class="dz" style="position: absolute; inset: 0; animation-duration: {{d.dur}}s; animation-delay: -{{d.dl}}s">
          <div style="position: absolute; left: 0; top: 0; width: 1.2px; height: 100%; background: rgba(220,228,236,.45)"></div>
          <sc-if value="{{ d.isBall }}" hint-placeholder-val="{{ true }}">
            <div style="position: absolute; left: -5px; top: {{d.len}}px; width: 11px; height: 7px; border-radius: 2px; background: linear-gradient(#F6D88A, #A87A22)"></div>
            <div style="position: absolute; left: {{d.bl}}px; top: {{d.bt}}px; width: {{d.size}}px; height: {{d.size}}px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.85) 0, {{d.c}} 32%, {{d.c2}} 100%); box-shadow: 0 6px 18px rgba(0,0,0,.5)"></div>
          </sc-if>
          <sc-if value="{{ d.isStar }}" hint-placeholder-val="{{ false }}">
            <svg width="30" height="30" viewBox="0 0 24 24" style="position: absolute; left: -15px; top: {{d.len}}px; filter: drop-shadow(0 0 8px rgba(255,200,80,.7))"><path d="M12 2.5l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8 6.2 20l1.4-6.4L2.7 9.2l6.5-.7z" fill="#FFC94D" stroke="#B8801C" stroke-width=".8" stroke-linejoin="round"></path></svg>
          </sc-if>
          <sc-for list="{{ d.bulbs }}" as="b" hint-placeholder-count="0">
            <div style="position: absolute; left: -4px; top: {{b.y}}px">
              <div style="width: 7px; height: 5px; margin-left: .5px; border-radius: 1.5px; background: #1E2A22"></div>
              <div class="bl" style="width: 8px; height: 12px; border-radius: 50% 50% 46% 46%; background: {{b.c}}; box-shadow: 0 0 7px 2px {{b.c}}, 0 0 20px 5px {{b.g}}; animation-duration: {{b.du}}s; animation-delay: -{{b.dl}}s"></div>
            </div>
          </sc-for>
        </div>
        </div>
      </sc-for>

      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
        <div class="{{c.kCls}}" style="position: absolute; left: {{c.left}}px; top: 36px; width: 320px; height: 500px; animation-delay: {{c.kd}}s">
        <div class="{{c.cwCls}}" style="position: absolute; inset: 0; transform-origin: 50% 0; animation-duration: {{c.dur}}s; animation-delay: -{{c.dl}}s">
          <div aria-hidden="true" style="position: absolute; left: 155px; top: 0; width: 10px; height: 15px; border-radius: 3px; background: linear-gradient(90deg, #8D96A3, #E9EDF2 45%, #7A838F); box-shadow: 0 2px 4px rgba(0,0,0,.6)"></div>
          <div aria-hidden="true" style="position: absolute; left: 159.5px; top: 14px; width: 1.2px; height: 40px; background: rgba(225,232,240,.6)"></div>
          <div style="position: absolute; left: 0; top: 50px; width: 320px; height: 420px; perspective: 1500px; transform: scale({{c.sc}}); transform-origin: 50% 0; transition: transform .6s cubic-bezier(.22,.8,.2,1)">
            <div class="{{c.flipCls}}" style="position: relative; width: 100%; height: 100%; transform: rotateY({{c.rot}}deg)">

              <div class="{{c.frontCls}}" style="background: #F6F1EC; color: #0B0B0C; box-shadow: 0 28px 60px rgba(0,0,0,.6)">
                <button type="button" onClick="{{ c.flip }}" aria-label="{{c.frontLabel}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: transparent; cursor: pointer"></button>
                <div aria-hidden="true" style="position: absolute; left: 153px; top: 10px; width: 14px; height: 14px; border-radius: 50%; background: #05070B; box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 0 0 2px rgba(0,0,0,.08)"></div>
                <div style="position: absolute; inset: 0; padding: 38px 24px 24px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; pointer-events: none">
                  <sc-if value="{{ c.isDay }}" hint-placeholder-val="{{ true }}">
                    <div class="hd" style="font-size: 30px; font-weight: 500; letter-spacing: 0">{{c.month}}</div>
                    <div class="num" style="margin-top: 0; font-size: 200px; font-weight: 600; line-height: 1; letter-spacing: 0">{{c.dnum}}</div>
                    <div style="margin-top: 8px; font-size: 16px; font-weight: 500; letter-spacing: .04em">{{c.wdUp}}</div>
                  </sc-if>
                  <sc-if value="{{ c.isIntro }}" hint-placeholder-val="{{ false }}">
                    <div style="font-size: 13px; font-weight: 600; letter-spacing: .14em; color: #5E5953">THE GOOD DEAL</div>
                    <div class="num" style="margin-top: auto; font-size: 60px; font-weight: 600; line-height: 1; letter-spacing: 0; text-align: center">How it<br>works</div>
                    <div style="margin-top: 14px; font-size: 16px; font-weight: 500; color: #5E5953">{{c.range}}</div>
                  </sc-if>
                  <div style="margin-top: auto; position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; pointer-events: auto">
                    <sc-if value="{{ c.isLocked }}" hint-placeholder-val="{{ true }}">
                      <span style="width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid rgba(11,11,12,.2); background: #fff; display: flex; align-items: center; justify-content: center; flex: none">
                        <svg role="img" aria-label="Locked" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path><path d="M12 14.5v2.5"></path></svg>
                      </span>
                    </sc-if>
                    <sc-if value="{{ c.isOpen }}" hint-placeholder-val="{{ false }}">
                      <span style="width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid rgba(11,11,12,.12); background: #FFC94D; display: flex; align-items: center; justify-content: center; flex: none">
                        <svg role="img" aria-label="Unlocked" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 7.6-1.8"></path><path d="M12 14.5v2.5"></path></svg>
                      </span>
                    </sc-if>
                    <button type="button" onClick="{{ c.flip }}" style="height: 48px; padding: 0 20px 0 24px; border: 0; border-radius: 999px; background: {{c.btnBg}}; color: {{c.btnFg}}; animation: {{c.btnAnim}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer">Discover<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
                  </div>
                </div>
                <sc-if value="{{ c.isNew }}" hint-placeholder-val="{{ false }}">
                  <span style="position: absolute; left: 16px; top: 16px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #0B0B0C; color: #FFC94D; font-size: 11px; font-weight: 700; letter-spacing: .08em; pointer-events: none"><span style="width: 6px; height: 6px; border-radius: 50%; background: #FFC94D"></span>NEW</span>
                </sc-if>
                <sc-if value="{{ c.nudged }}" hint-placeholder-val="{{ false }}">
                  <div role="status" style="position: absolute; z-index: 3; left: 24px; right: 24px; bottom: 86px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 999px; background: rgba(11,11,12,.9); color: #fff; font-size: 14px; font-weight: 600; pointer-events: none; animation: nudge 2.2s ease both">
                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFC94D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg>Opens on {{c.dateLabel}}
                  </div>
                </sc-if>
              </div>

              <sc-if value="{{ c.near }}" hint-placeholder-val="{{ true }}">
              <div class="{{c.backCls}}" style="transform: rotateY(180deg); background: linear-gradient(135deg, #F4E1FF 0%, #D6F2FF 30%, #FFF5D2 55%, #FFDAE8 78%, #E3DEFF 100%); color: #15151B; box-shadow: 0 28px 60px rgba(0,0,0,.6)">
                <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.75) 45%, transparent 60%), repeating-linear-gradient(60deg, rgba(255,255,255,0) 0 14px, rgba(255,255,255,.18) 14px 15px)"></div>
                <button type="button" onClick="{{ c.flip }}" aria-label="{{c.backLabel}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: transparent; cursor: pointer"></button>
                <div style="position: absolute; inset: 0; padding: 28px 24px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; pointer-events: none">
                  <span style="font-size: 11px; font-weight: 600; letter-spacing: .14em; color: #4A4A57">THE GOOD DEAL · {{c.kicker}}</span>
                  <h3 class="hd" style="margin: 4px 0 0; font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: 0">{{c.pt}}</h3>
                  <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #33333D">{{c.ps}}</p>
                  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
                    <sc-if value="{{ c.canBid }}" hint-placeholder-val="{{ true }}">
                      <button type="button" onClick="{{ c.bid }}" style="pointer-events: auto; position: relative; height: 48px; width: 100%; border: 0; border-radius: 999px; background: #FFC94D; color: #0B0B0C; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">Place a bid<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg></button>
                    </sc-if>
                    <button type="button" onClick="{{ c.info }}" style="pointer-events: auto; position: relative; height: 46px; width: 100%; border: 0; border-radius: 999px; background: rgba(255,255,255,.55); color: #15151B; border: 1px solid rgba(21,21,27,.18) !important; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">More information<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15151B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
                  </div>
                </div>
              </div>
              </sc-if>

            </div>
            <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: 26px; background: #000; opacity: {{c.dim}}; transition: opacity .6s ease; pointer-events: none"></div>
            <sc-if value="{{ c.showIcon }}" hint-placeholder-val="{{ false }}">
              <img src="{{c.icon}}" alt="{{c.iconAlt}}" draggable="false" style="position: absolute; left: {{c.ix}}px; top: {{c.iy}}px; width: {{c.isz}}px; height: auto; transform: rotate({{c.ir}}deg); filter: drop-shadow(0 16px 18px rgba(0,0,0,.35)) brightness({{c.ibr}}); transition: filter .6s ease; pointer-events: none; animation: popin .7s cubic-bezier(.2,1.5,.4,1) .55s both">
            </sc-if>
          </div>
        </div>
        </div>
      </sc-for>

      
<sc-for list="{{ lights }}" as="b" hint-placeholder-count="12">

<script>
class Component extends DCLogic {
  componentDidMount() {
    // re-render when a new day unlocks (checked every 30 s, survives sleep/background tabs)
    this._tick = setInterval(() => {
      const c = this.unlockedCount();
      if (c !== this._lastCount) { this._lastCount = c; this.forceUpdate(); }
    }, 30000);
  }
  componentWillUnmount() { clearInterval(this._tick); clearTimeout(this._nt); clearTimeout(this._tt); }
  // Day 1 unlocks on this date at local midnight. For a test run set it to today, e.g. new Date(2026, 10, 26).
  startDate() { return new Date(2026, 11, 1); }
  // DEMO: pretend today is day 5 (days 1–4 already opened, day 5 new). Return null to use the real date.
  simulatedDay() { return 5; }
  dayDate(d) { const s = this.startDate(); return new Date(s.getFullYear(), s.getMonth(), s.getDate() + d - 1); }
  unlockedCount() {
    const sim = this.simulatedDay();
    if (sim != null) return sim;
    const now = new Date();
    let c = 0;
    for (let d = 1; d <= 24; d++) if (now >= this.dayDate(d)) c = d;
    return c;
  }
  buildStatic(amount) {
    const N = 25, LEAD = 3, PITCH = 390, PIN = 40;
    const T = N + LEAD * 2;
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const r2 = (v) => Math.round(v * 100) / 100;

    // rope: swags between pins
    const pts = [];
    for (let k = -1; k <= T; k++) pts.push({ x: k * PITCH + PITCH / 2, sag: 30 + rnd() * 10 });
    let rope = 'M' + pts[0].x + ' ' + PIN;
    const swags = [];
    for (let k = 0; k < pts.length - 1; k++) {
      const a = pts[k], b = pts[k + 1];
      const cx = (a.x + b.x) / 2, cy = PIN + a.sag * 2;
      rope += ' Q' + cx + ' ' + cy + ' ' + b.x + ' ' + PIN;
      swags.push({ a, b, cx, cy });
    }
    const bulbColors = [['#FFC857', 'rgba(255,200,87,.45)'], ['#FF4D5E', 'rgba(255,77,94,.45)'], ['#3DDC97', 'rgba(61,220,151,.4)'], ['#8FD3FF', 'rgba(143,211,255,.45)'], ['#FFF1C9', 'rgba(255,241,201,.45)']];
    const lights = [];
    let ci = 0;
    swags.forEach((s) => {
      [0.25, 0.5, 0.75].forEach((t) => {
        const u = 1 - t;
        const x = u * u * s.a.x + 2 * u * t * s.cx + t * t * s.b.x;
        const y = u * u * PIN + 2 * u * t * s.cy + t * t * PIN;
        const col = bulbColors[ci++ % bulbColors.length];
        lights.push({ x: r2(x), y: r2(y - 2), r: r2((rnd() - 0.5) * 30), c: col[0], g: col[1], du: r2(1.6 + rnd() * 2.6), dl: r2(rnd() * 4), kd: r2(0.02 + rnd() * 0.1) });
      });
    });

    // hanging decorations between cards
    const ballCols = [['#E0313F', '#6E0E17'], ['#E8B23A', '#7A5310'], ['#1E9E6A', '#0B4B31'], ['#7FC4F0', '#245C88'], ['#D9DEE6', '#6B7380']];
    const decor = [];
    swags.forEach((s, k) => {
      const r = rnd();
      if (r > 0.62) return;
      const x = r2((s.a.x + s.b.x) / 2), y = r2(PIN + (s.cy - PIN) / 2);
      const len = Math.round(40 + rnd() * 120);
      const base = { x, y, len, dur: r2(3 + rnd() * 2.5), dl: r2(rnd() * 5), kd: r2(0.04 + rnd() * 0.1), isBall: false, isStar: false, bulbs: [] };
      if (r < 0.3) {
        const bc = ballCols[k % ballCols.length];
        const size = Math.round(24 + rnd() * 10);
        decor.push({ ...base, isBall: true, c: bc[0], c2: bc[1], size, bl: r2(-size / 2 + 1), bt: len + 5 });
      } else if (r < 0.48) {
        const bulbs = [];
        for (let yb = 14; yb < len; yb += 24) {
          const col = bulbColors[ci++ % bulbColors.length];
          bulbs.push({ y: yb, c: col[0], g: col[1], du: r2(1.4 + rnd() * 2.4), dl: r2(rnd() * 4) });
        }
        decor.push({ ...base, len: len + 12, bulbs });
      } else {
        decor.push({ ...base, isStar: true });
      }
    });

    const anim = [];
    for (let i = 0; i < N; i++) anim.push({ dur: r2(4.4 + rnd() * 2.6), dl: r2(rnd() * 6), kd: r2(rnd() * 0.08) });

      if (!/^\d+([.,]\d{1,2})?$/.test(raw)) return fail('Use digits only, with at most 2 decimal places, e.g. ' + mn + ' or ' + mn + ',50.');
      const amt = parseFloat(raw.replace(',', '.'));
      if (amt < mn) return fail('Your bid must be at least ' + pln(mn) + '.');
      if (amt > 1000000) return fail('The maximum bid is PLN 1,000,000.');
      const nick = ((this._nick && this._nick.value) || '').trim().slice(0, 30);
      const next = { ...(cur.bids || this._savedBids || {}) };
      next[d] = { amt, by: nick || 'Anonymous', mine: true };
      try { window.localStorage.setItem(BKEY, JSON.stringify(next)); } catch (err) {}
      try { if (nick) window.localStorage.setItem('tgd-nick', nick); } catch (err) {}
      if (this._amt) this._amt.value = '';
      this.setState({ bids: next, bidErr: null, bidOk: 'Your bid of ' + pln(amt) + ' is now leading.' });
    };

    return {
      modalOpen, m, closeModal,
      testMode: TEST,
      testText: SIM != null ? 'Demo · today is ' + this.dayDate(SIM).getDate() + ' ' + MONTHS[this.dayDate(SIM).getMonth()] : 'Test mode · day 1 = ' + this.dayDate(1).getDate() + ' ' + MONTHS[this.dayDate(1).getMonth()],
      bannerNew: UNLOCKED >= 1 && !revealed[UNLOCKED], bannerDone: UNLOCKED >= 1 && !!revealed[UNLOCKED], bannerSoon: UNLOCKED < 1,
      todayLabel: UNLOCKED >= 1 ? this.dayDate(UNLOCKED).getDate() + ' ' + MONTHS[this.dayDate(UNLOCKED).getMonth()] : '',
      goToday: () => go(UNLOCKED),
      openTodayFromModal: () => { this.setState({ modal: null }); go(UNLOCKED); },
      bidOpen, b, closeBid, submitBid,
      bidFromModal: () => this.setState({ bid: st.modal, modal: null, bidErr: null, bidOk: null }),
      amountRef: (el) => { this._amt = el; },
      nickRef: (el) => {
        if (el && el !== this._nick) { try { el.value = window.localStorage.getItem('tgd-nick') || ''; } catch (e) {} }
        this._nick = el;
      },
      openHow: () => this.setState({ modal: 0 }),
      toastOn: !!st.toast, toast: st.toast || '',
      share: () => {
        const url = window.location.href, title = 'The Good Deal by Synerise';
        const toast = (t) => { this.setState({ toast: t }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: null }), 2400); };
        const copy = () => {
          try {
            navigator.clipboard.writeText(url).then(() => toast('Link copied'), () => toast('Copy the link from the address bar'));
          } catch (e) { toast('Copy the link from the address bar'); }
        };
        if (navigator.share) navigator.share({ title, text: '24 days, 24 prize draws — open today\'s card!', url }).catch((e) => { if (!e || e.name !== 'AbortError') copy(); });
        else copy();
      },
      resetTest: () => {
        try { window.localStorage.removeItem(SKEY); window.localStorage.removeItem(BKEY); } catch (e) {}
        this._saved = null; this._savedBids = null;
        this.setState({ revealed: { ...SIM_OPENED }, bids: {}, flipped: {}, index: defIndex, modal: null, bid: null });
      },
      modalKey: (e) => { if (e.key === 'Escape') { if (bidOpen) closeBid(); else closeModal(); } },
      closeRef: (el) => { if (el && !this._focused) { this._focused = true; el.focus(); } if (!el) this._focused = false; },
      rope: S.rope, lights: S.lights, decor: S.decor, snowBack: S.snowBack, snowFront: S.snowFront, cards,
      trackW: T * PITCH,
      offset: offsetOf(index),
      trackRef: (el) => { this.track = el; },
      down, move, up, swallow, wheel,
      trackCls: st.kick ? (st.kick.n % 2 ? 'ka' : 'kb') + (st.kick.dir > 0 ? ' fwd' : ' bwd') : '',
      cur: index ? this.dayDate(index).getDate() + ' ' + MONTHS[this.dayDate(index).getMonth()] : 'How it works', curSub: index ? ' · ' + pad(index) + ' / 24' : '', pct: r2(((index + 1) / N) * 100),
      atStart: index <= 0, atEnd: index >= N - 1,
      prev: () => go(index - 1), next: () => go(index + 1), home: () => go(0)
    };
  }
}
DCMount(Component, document.getElementById('dc-template'), document.getElementById('app'));
</script>
